<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regiões - Painel Admin | Coleta Quixadá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-trash3-fill me-2"></i>Coleta Quixadá - CE</a>
            <button class="btn btn-outline-light btn-sm" onclick="sair()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card p-3 shadow-sm border-0 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 id="boas-vindas" class="fw-bold text-success mb-0">Bem-vindo(a)!</h4>
                    <small id="info-perfil" class="text-muted"></small>
                </div>
                <span id="badge-nivel" class="badge bg-success fs-6"></span>
            </div>
        </div>

        <div class="card p-4 shadow-sm border-0 mb-4">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-clock-history me-2"></i>Alterar Horários de Coleta</h5>
            <form onsubmit="alterarHorarioBairro(event)">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Selecione o Bairro</label>
                        <select id="admin-bairro" class="form-select" required>
                            <option value="Centro">Centro</option>
                            <option value="Alto São Francisco">Alto São Francisco</option>
                            <option value="Campo Novo">Campo Novo</option>
                            <option value="São João">São João</option>
                            <option value="Planalto Universitário">Planalto Universitário</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Novo Horário</label>
                        <input type="text" id="admin-novo-horario" class="form-control" placeholder="Ex: 08h às 12h" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100 fw-semibold"><i class="bi bi-check-circle me-1"></i>Atualizar Horário</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card p-4 shadow-sm border-0">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-calendar-week me-2"></i>Horários Atuais por Bairro</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Bairro</th><th>Dias</th><th>Horário</th></tr></thead>
                    <tbody>
                        <tr><td>Centro</td><td>Seg, Qua, Sex</td><td id="horario-Centro">07h às 11h</td></tr>
                        <tr><td>Alto São Francisco</td><td>Seg, Qua, Sex</td><td id="horario-Alto São Francisco">13h às 17h</td></tr>
                        <tr><td>Campo Novo</td><td>Ter, Qui, Sáb</td><td id="horario-Campo Novo">07h às 11h</td></tr>
                        <tr><td>São João</td><td>Ter, Qui, Sáb</td><td id="horario-São João">13h às 17h</td></tr>
                        <tr><td>Planalto Universitário</td><td>Seg, Qua, Sex</td><td id="horario-Planalto Universitário">15h às 18h</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="../../src/ts/regiao.js"></script>
    <script type="module">
        import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
        exigirPerfil(['admin']);
        exibirCabecalhoSessao();
        window.sair = sair;
    </script>
</body>
</html>
