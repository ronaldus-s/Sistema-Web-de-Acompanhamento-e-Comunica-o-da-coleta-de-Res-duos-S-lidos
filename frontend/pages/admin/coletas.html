<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletas - Painel Admin | Coleta Quixadá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body>
<div class="admin-shell">

    <aside class="admin-sidebar" id="admin-sidebar">
        <a class="app-brand" href="#">
            <span class="app-brand-logo">
                <img src="https://sedumasp-quixada.web.app/assets/logo-sedumasp-BuEpVZSg.png" alt="Logo SEDUMASP">
            </span>
            <span class="app-brand-text">
                Coleta Quixadá
                <small>Painel Administrativo</small>
            </span>
        </a>

        <div class="side-section">Gestão</div>
        <nav class="side-nav">
            <a href="regioes.html" class="side-link"><i class="bi bi-geo-alt"></i>Regiões</a>
            <a href="aviso.html" class="side-link"><i class="bi bi-megaphone"></i>Avisos</a>
            <a href="coletas.html" class="side-link active"><i class="bi bi-truck"></i>Coletas</a>
            <span class="side-link disabled"><i class="bi bi-people"></i>Usuários<em class="tag-soon">Em breve</em></span>
        </nav>

        <button class="btn btn-nav-light w-100" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
    </aside>
    <div class="admin-overlay" id="admin-overlay"></div>

    <div class="admin-main">

        <header class="admin-topbar">
            <button class="btn-menu" id="btn-menu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
            <div class="flex-grow-1">
                <h1 id="boas-vindas" class="welcome-title">Bem-vindo(a)!</h1>
                <small id="info-perfil" class="welcome-info"></small>
            </div>
            <span id="badge-nivel" class="badge-nivel"></span>
        </header>

        <main class="admin-content">

            <div class="admin-page-head">
                <h2><i class="bi bi-truck me-2"></i>Coletas</h2>
                <p>Acompanhe as coletas iniciadas pelos coletores e encerre as que ficaram abertas.</p>
            </div>

            <section class="panel-card">
                <div class="panel-card-header">
                    <h2><i class="bi bi-clock-history me-2"></i>Últimas 50 coletas registradas</h2>
                </div>
                <div class="table-responsive">
                    <table class="table tabela-cronograma align-middle mb-0">
                        <thead>
                            <tr><th>Rota</th><th>Status</th><th>Situação</th><th>Última posição</th><th>Ações</th></tr>
                        </thead>
                        <tbody id="tabela-coletas-admin">
                            <tr><td colspan="5" class="text-muted small">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
</div>

<script type="module">
    import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
    import { carregarColetasAdmin } from '../../src/ts/coleta.js';
    exigirPerfil(['admin']);
    exibirCabecalhoSessao();
    carregarColetasAdmin();
    window.sair = sair;
</script>
<script>
    const side = document.getElementById('admin-sidebar');
    const overlay = document.getElementById('admin-overlay');
    const alternarMenu = () => { side.classList.toggle('open'); overlay.classList.toggle('show'); };
    document.getElementById('btn-menu').addEventListener('click', alternarMenu);
    overlay.addEventListener('click', alternarMenu);
</script>
</body>
</html>
