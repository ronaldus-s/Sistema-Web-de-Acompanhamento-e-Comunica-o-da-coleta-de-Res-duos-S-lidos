<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos - Painel Admin | Coleta Quixadá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-trash3-fill me-2"></i>Coleta Quixadá - CE</a>
            <button class="btn btn-outline-light btn-sm" onclick="sair()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card p-3 shadow-sm border-0 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 id="boas-vindas" class="fw-bold text-success mb-0">Bem-vindo(a)!</h4>
                    <small id="info-perfil" class="text-muted"></small>
                </div>
                <span id="badge-nivel" class="badge bg-success fs-6"></span>
            </div>
        </div>

        <div class="card p-4 shadow-sm border-0 mb-4">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-megaphone me-2"></i>Publicar Aviso aos Moradores</h5>
            <form onsubmit="publicarAviso(event)">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Título do Comunicado</label>
                    <input type="text" id="admin-titulo" class="form-control" placeholder="Ex: Manutenção no caminhão da Rota Centro" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Mensagem do Comunicado</label>
                    <textarea id="admin-msg" class="form-control" rows="2" placeholder="Digite os detalhes para a população..." required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success fw-semibold"><i class="bi bi-send me-1"></i>Publicar no Mural</button>
                    <button type="button" class="btn btn-outline-danger fw-semibold" onclick="removerAviso()"><i class="bi bi-trash me-1"></i>Remover Aviso Ativo</button>
                </div>
            </form>
        </div>

        <div class="card p-4 shadow-sm border-0">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-clipboard-check me-2"></i>Aviso Atualmente no Mural</h5>
            <div id="mural-avisos">
                <p class="text-muted small mb-0">Nenhum aviso urgente publicado no momento.</p>
            </div>
        </div>
    </div>

    <script type="module" src="../../src/ts/aviso.js"></script>
    <script type="module">
        import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
        exigirPerfil(['admin']);
        exibirCabecalhoSessao();
        window.sair = sair;
    </script>
</body>
</html>
