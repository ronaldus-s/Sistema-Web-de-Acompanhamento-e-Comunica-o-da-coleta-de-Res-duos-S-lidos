<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos - Painel Admin | Coleta Quixadá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body data-admin="true">
<div class="admin-shell">

    <aside class="admin-sidebar" id="admin-sidebar">
        <a class="app-brand" href="#">
            <span class="app-brand-logo">
                <img src="https://sedumasp-quixada.web.app/assets/logo-sedumasp-BuEpVZSg.png" alt="Logo SEDUMASP">
            </span>
            <span class="app-brand-text">
                Coleta Quixadá
                <small>Painel Administrativo</small>
            </span>
        </a>

        <div class="side-section">Gestão</div>
        <nav class="side-nav">
            <a href="regioes.html" class="side-link"><i class="bi bi-geo-alt"></i>Regiões</a>
            <a href="aviso.html" class="side-link active"><i class="bi bi-megaphone"></i>Avisos</a>
            <a href="coletas.html" class="side-link"><i class="bi bi-truck"></i>Coletas</a>
            <span class="side-link disabled"><i class="bi bi-people"></i>Usuários<em class="tag-soon">Em breve</em></span>
        </nav>

        <button class="btn btn-nav-light w-100" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
    </aside>
    <div class="admin-overlay" id="admin-overlay"></div>

    <div class="admin-main">

        <header class="admin-topbar">
            <button class="btn-menu" id="btn-menu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
            <div class="flex-grow-1">
                <h1 id="boas-vindas" class="welcome-title">Bem-vindo(a)!</h1>
                <small id="info-perfil" class="welcome-info"></small>
            </div>
            <span id="badge-nivel" class="badge-nivel"></span>
        </header>

        <main class="admin-content">

            <div class="admin-page-head">
                <h2><i class="bi bi-megaphone-fill me-2"></i>Avisos</h2>
                <p>Publique comunicados para os moradores e remova os que já não valem.</p>
            </div>

            <div class="admin-stack">

                <section class="panel-card">
                    <div class="panel-card-header">
                        <h2><i class="bi bi-pencil-square me-2"></i>Publicar novo aviso</h2>
                    </div>
                    <div class="panel-body">
                        <form onsubmit="publicarAviso(event)">
                            <div class="form-admin-grid cols-1">
                                <div class="field">
                                    <label class="field-label" for="admin-titulo">Título</label>
                                    <input type="text" id="admin-titulo" class="input-admin" placeholder="Ex: Coleta suspensa no feriado" required>
                                </div>
                                <div class="field">
                                    <label class="field-label" for="admin-msg">Mensagem</label>
                                    <textarea id="admin-msg" class="input-admin" rows="4" placeholder="Escreva o comunicado aqui..." required></textarea>
                                </div>
                                <div>
                                    <button type="submit" class="btn-solid btn-solid-auto"><i class="bi bi-send"></i>Publicar aviso</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="panel-card">
                    <div class="panel-card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <h2><i class="bi bi-list-ul me-2"></i>Avisos publicados</h2>
                        <span id="contador-avisos" class="contador-avisos d-none"></span>
                    </div>
                    <div class="panel-body">
                        <div id="mural-avisos" class="avisos-lista">
                            <p class="text-muted small mb-0">Carregando...</p>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>

<script type="module" src="../../src/ts/aviso.js"></script>
<script type="module">
    import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
    exigirPerfil(['admin']);
    exibirCabecalhoSessao();
    window.sair = sair;
</script>
<script>
    const side = document.getElementById('admin-sidebar');
    const overlay = document.getElementById('admin-overlay');
    const alternarMenu = () => { side.classList.toggle('open'); overlay.classList.toggle('show'); };
    document.getElementById('btn-menu').addEventListener('click', alternarMenu);
    overlay.addEventListener('click', alternarMenu);
</script>
</body>
</html>
