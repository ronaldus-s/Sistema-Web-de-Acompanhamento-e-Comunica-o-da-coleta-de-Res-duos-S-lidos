<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos - Coleta Quixadá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="app-navbar">
        <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
            <a class="app-brand" href="#">
                <span class="app-brand-logo">
                    <img src="https://sedumasp-quixada.web.app/assets/logo-sedumasp-BuEpVZSg.png" alt="Logo SEDUMASP">
                </span>
                <span class="app-brand-text">
                    Coleta Quixadá
                    <small>Sistema de Gestão de Resíduos</small>
                </span>
            </a>

            <div class="app-nav-links">
                <a href="mapa.html" class="nav-link-app"><i class="bi bi-map"></i><span>Mapa</span></a>
                <a href="avisos.html" class="nav-link-app active"><i class="bi bi-megaphone"></i><span>Avisos</span></a>
                <a href="cronograma.html" class="nav-link-app"><i class="bi bi-calendar-week"></i><span>Cronograma</span></a>
                <button class="btn btn-nav-light" onclick="sair()">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="container page-content page-content-top">

        <!-- BOAS-VINDAS -->
        <div class="welcome-card">
            <div class="welcome-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="flex-grow-1">
                <h1 id="boas-vindas" class="welcome-title">Bem-vindo(a)!</h1>
                <small id="info-perfil" class="welcome-info"></small>
            </div>
            <span id="badge-nivel" class="badge-nivel"></span>
        </div>

        <!-- MURAL -->
        <div class="panel-card">
            <div class="panel-card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h2><i class="bi bi-megaphone-fill me-2"></i>Mural de comunicados</h2>
                    <p>Avisos oficiais da Prefeitura sobre a coleta de resíduos.</p>
                </div>
                <span id="contador-avisos" class="contador-avisos d-none"></span>
            </div>

            <div class="panel-body">
                <div id="mural-avisos" class="avisos-lista">
                    <p class="text-muted small mb-0">Carregando...</p>
                </div>
            </div>
        </div>

    </main>

    <footer class="app-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>© 2026 Quixadá • Ceará</span>
            <span><i class="bi bi-shield-check me-1"></i>Secretaria de Desenvolvimento Urbano e Meio Ambiente</span>
        </div>
    </footer>

    <script type="module" src="../../src/ts/aviso.js"></script>
    <script type="module">
        import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
        exigirPerfil(['usuario']);
        exibirCabecalhoSessao();
        window.sair = sair;
    </script>
</body>
</html>
