<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Coleta Quixadá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="app-navbar">
        <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
            <a class="app-brand" href="#">
                <span class="app-brand-logo">
                    <img src="https://sedumasp-quixada.web.app/assets/logo-sedumasp-BuEpVZSg.png" alt="Logo SEDUMASP">
                </span>
                <span class="app-brand-text">
                    Coleta Quixadá
                    <small>Sistema de Gestão de Resíduos</small>
                </span>
            </a>

            <div class="app-nav-links">
                <a href="mapa.html" class="nav-link-app active"><i class="bi bi-map"></i><span>Mapa</span></a>
                <a href="avisos.html" class="nav-link-app"><i class="bi bi-megaphone"></i><span>Avisos</span></a>
                <a href="cronograma.html" class="nav-link-app"><i class="bi bi-calendar-week"></i><span>Cronograma</span></a>
                <button class="btn btn-nav-light" onclick="sair()">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="container page-content page-content-top">

        <!-- BOAS-VINDAS -->
        <div class="welcome-card">
            <div class="welcome-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="flex-grow-1">
                <h1 id="boas-vindas" class="welcome-title">Bem-vindo(a)!</h1>
                <small id="info-perfil" class="welcome-info"></small>
            </div>
            <span id="badge-nivel" class="badge-nivel"></span>
        </div>

        <!-- MAPA -->
        <div class="panel-card">
            <div class="panel-card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h2><i class="bi bi-geo-alt-fill me-2"></i>Caminhão em tempo real</h2>
                    <p>A posição é atualizada automaticamente a cada 5 segundos.</p>
                </div>
                <span class="live-pill">
                    <span class="live-dot"></span>Ao vivo
                    <small id="ultima-atualizacao"></small>
                </span>
            </div>

            <div class="status-strip">
                <div id="status-coleta" class="status-line">Verificando...</div>
                <div id="distancia-caminhao" class="distance-line"></div>
            </div>

            <div class="mapa-wrap">
                <div id="mapa"></div>

                <div class="mapa-controles">
                    <button type="button" id="btn-ver-caminhao" class="btn-mapa">
                        <i class="bi bi-truck-front-fill"></i><span>Ver caminhão</span>
                    </button>
                    <button type="button" id="btn-ver-eu" class="btn-mapa">
                        <i class="bi bi-crosshair"></i><span>Minha posição</span>
                    </button>
                </div>
            </div>

            <div class="mapa-legenda">
                <span><span class="legenda-caminhao"><i class="bi bi-truck-front-fill"></i></span>Caminhão de coleta</span>
                <span><span class="legenda-usuario"></span>Você</span>
            </div>
        </div>

    </main>

    <footer class="app-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>© 2026 Quixadá • Ceará</span>
            <span><i class="bi bi-shield-check me-1"></i>Secretaria de Desenvolvimento Urbano e Meio Ambiente</span>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../../src/ts/mapa.js"></script>
    <script type="module">
        import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
        exigirPerfil(['usuario']);
        exibirCabecalhoSessao();
        window.sair = sair;
    </script>
</body>
</html>
