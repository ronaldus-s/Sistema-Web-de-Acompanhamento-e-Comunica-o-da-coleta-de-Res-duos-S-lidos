<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Coletor | Coleta Quixadá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-trash3-fill me-2"></i>Coleta Quixadá - CE</a>
            <button class="btn btn-outline-light btn-sm" onclick="sair()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card p-3 shadow-sm border-0 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 id="boas-vindas" class="fw-bold text-success mb-0">Bem-vindo(a)!</h4>
                    <small id="info-perfil" class="text-muted"></small>
                </div>
                <span id="badge-nivel" class="badge bg-success fs-6"></span>
            </div>
        </div>

        <div class="card p-4 shadow-sm border-0">
            <h5 class="fw-bold text-success mb-3"><i class="bi bi-truck me-2"></i>Painel Operacional do Coletor</h5>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Selecione sua Rota</label>
                    <select id="coletor-rota" class="form-select">
                        <option value="Rota 01 - Centro / Alto São Francisco">Rota 01 - Centro / Alto São Francisco</option>
                        <option value="Rota 02 - Campo Novo / São João">Rota 02 - Campo Novo / São João</option>
                        <option value="Rota 03 - Planalto Universitário">Rota 03 - Planalto Universitário</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end gap-2">
                    <button class="btn btn-success flex-fill fw-semibold" onclick="iniciarRotaColetor()"><i class="bi bi-play-circle me-1"></i>Iniciar Transmissão</button>
                    <button class="btn btn-danger flex-fill fw-semibold" onclick="cancelarRotaColetor()"><i class="bi bi-stop-circle me-1"></i>Cancelar Transmissão</button>
                </div>
            </div>

            <div class="table-responsive mt-3">
                <table class="table table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>Rota Atual</th><th>Horário de Início</th><th>Status da Transmissão</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="tabela-rota">-</td>
                            <td id="tabela-inicio">-</td>
                            <td><span id="tabela-status" class="badge bg-secondary">Aguardando Início</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="../../src/ts/coleta.js"></script>
    <script type="module">
        import { exibirCabecalhoSessao, exigirPerfil, sair } from '../../src/ts/auth.js';
        exigirPerfil(['coletor']);
        exibirCabecalhoSessao();
        window.sair = sair;
    </script>
</body>
</html>
