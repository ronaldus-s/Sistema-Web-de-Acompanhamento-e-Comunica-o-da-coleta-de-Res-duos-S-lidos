<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coleta Quixadá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="card login-card p-4 shadow-sm border-0">
        <div class="text-center mb-4">
            <i class="bi bi-trash3-fill text-success fs-1"></i>
            <h3 class="fw-bold text-success mt-2">Coleta Quixadá</h3>
            <p class="text-muted small">Sistema de Acompanhamento da Coleta Seletiva</p>
        </div>

        <form id="loginForm" onsubmit="realizarLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">E-mail ou Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="email" placeholder="seu.email@exemplo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label small fw-semibold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="perfil" class="form-label small fw-semibold">Tipo de Acesso</label>
                <select class="form-select" id="perfil" required>
                    <option value="usuario">Morador / Usuário</option>
                    <option value="coletor">Coletor / Motorista</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-semibold shadow-sm">Entrar no Sistema</button>
        </form>
    </div>

    <script type="module" src="src/ts/auth.js"></script>
</body>
</html>
